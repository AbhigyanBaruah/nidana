[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "nidana"
version = "0.1.0"
description = "Hybrid C++/Python CLI tool"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
nidana = "nidana.cli:app"

[tool.scikit-build]
cmake.source-dir = "ext"
wheel.packages = ["src/nidana"]
